[project]
name = "mn-worker-wasmtime-agent"
dynamic = ["version"]
description = "WASI 0.3 command component worker for Wasmtime."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mirrorneuron-python-sdk"]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = ".."
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mn_worker_wasmtime_agent = ["resources/*.json"]

[project.entry-points."mn.agents"]
"mn-agents.worker.wasmtime" = "mn_worker_wasmtime_agent:load_agent_definition"
